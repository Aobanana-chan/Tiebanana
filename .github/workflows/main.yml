# Build Release
#
# 发布流程：
#   - 推送 v* tag  → 构建签名 APK、无签名 IPA 和 Windows ZIP，汇总到同一 GitHub Release
#   - 手动触发     → 只构建并上传 artifact，不创建 Release
#
# 需要的仓库 Secrets：
#   SUBMODULE_TOKEN    能读 Tiebanana + headless_tieba 的 PAT（内容：只读）
#   KEYSTORE_BASE64    release keystore（key.jks）的 base64
#   KEYSTORE_PASSWORD  keystore 密码
#   KEY_ALIAS          密钥别名
#   KEY_PASSWORD       密钥密码
#
# 发布用 GITHUB_TOKEN（permissions: contents: write），不再需要 RELEASE_TOKEN。

name: Build Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROPERTIES_PATH: "./android/key.properties"
  KEYSTORE_PATH: "./android/key.jks"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # tieba_contract 是公开契约子模块；headless_tieba 是私有协议子模块。
      # checkout 的 token 也用于主仓库，所以 PAT 必须同时能读两个仓库。
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.7"
          cache: true

      # CI 使用私有协议实现：把 tieba_backend_demo 的依赖地址指向
      # tool/private/tieba_backend_demo（内部依赖 headless_tieba 子模块）。
      - name: Select private backend
        run: |
          git submodule status
          cp tool/private/pubspec_overrides.example.yaml pubspec_overrides.yaml

      # 签名文件放在 android/ 下：key.properties 里的 storeFile=../key.jks
      # 相对 android/app/ 解析，正好指向 android/key.jks。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../key.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > "$PROPERTIES_PATH"

      - name: Get dependencies
        run: flutter pub get

      - name: Build ObjectBox entities
        run: dart run build_runner build --delete-conflicting-outputs

      # tag 构建用 tag 作为 versionName（v1.0.2 → 1.0.2）；
      # versionCode 用 1000+运行号，保证高于 pubspec 里的 +N 且单调递增，
      # 手动触发与 tag 构建共用同一套编码，避免互相降级。
      - name: Build release APKs
        run: |
          args=(--release --split-per-abi --build-number=$((1000 + GITHUB_RUN_NUMBER)))
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--build-name="${GITHUB_REF_NAME#v}")
          fi
          flutter build apk "${args[@]}"

      # 防止以后签名配置回退成 debug（每次 runner 随机密钥，用户无法覆盖升级）。
      - name: Verify release signature
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::APK is still signed with the debug key"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    # connectivity_plus 7.x uses NWPath.isUltraConstrained, which requires
    # the iOS 26 SDK shipped with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Select private backend
        run: cp tool/private/pubspec_overrides.example.yaml pubspec_overrides.yaml

      # Native plugin dependencies include CocoaPods and Swift Package Manager packages.
      - name: Configure iOS toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
          flutter config --enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get

      - name: Build ObjectBox entities
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned iOS app
        shell: bash
        run: |
          plutil -lint ios/Runner/Info.plist ios/Flutter/AppFrameworkInfo.plist ios/Runner.xcodeproj/project.pbxproj
          args=(--release --no-codesign --build-number=$((1000 + GITHUB_RUN_NUMBER)))
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--build-name="${GITHUB_REF_NAME#v}")
          fi
          flutter build ios "${args[@]}"

      # --no-codesign 只生成 .app；按 IPA 的 Payload 布局封装，供用户自行签名。
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          test -d "$APP/Frameworks/Mpv.framework"
          if codesign --verify "$APP" 2>/dev/null; then
            echo "::error::Expected an unsigned iOS application"
            exit 1
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          mkdir -p build/ios/unsigned/Payload
          ditto "$APP" build/ios/unsigned/Payload/Runner.app
          cd build/ios/unsigned
          /usr/bin/zip -qry "Tiebanana-${VERSION}+${BUILD}-ios-无签名.ipa" Payload
          unzip -t ./*.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: release-ios-无签名
          path: build/ios/unsigned/*.ipa
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Select private backend
        shell: pwsh
        run: Copy-Item tool/private/pubspec_overrides.example.yaml pubspec_overrides.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build ObjectBox entities
        run: dart run build_runner build --delete-conflicting-outputs

      # 与 APK/iOS 共用 build-name/build-number，tag 构建用 tag 作为版本号。
      - name: Resolve version
        shell: pwsh
        run: |
          $buildName = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $buildName = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          "BUILD_NAME=$buildName" >> $env:GITHUB_ENV
          "BUILD_NUMBER=$(1000 + [int]$env:GITHUB_RUN_NUMBER)" >> $env:GITHUB_ENV

      - name: Build Windows app
        shell: pwsh
        run: flutter build windows --release "--build-name=$env:BUILD_NAME" "--build-number=$env:BUILD_NUMBER"

      # 整个 Release 目录（exe、dll、data/）一起打包，解压后保留 Tiebanana/ 目录。
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$release/tiebanana.exe")) {
            throw "缺少 Windows 构建产物：$release/tiebanana.exe"
          }
          if (-not (Test-Path "$release/data/flutter_assets")) {
            throw "缺少 Flutter 资源目录：$release/data/flutter_assets"
          }
          $stage = 'build/windows/package/Tiebanana'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "$release/*" -Destination $stage -Recurse -Force
          $zip = "build/windows/package/Tiebanana-$env:BUILD_NAME+$env:BUILD_NUMBER-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List FullName, Length

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: build/windows/package/*.zip
          if-no-files-found: error

  # 所有平台都成功后才发布，避免 Release 只有部分平台的安装包。
  release:
    needs: [android, ios, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: dart tool/generate_release_notes.dart "$RELEASE_TAG" build/release-notes.md

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*.apk,release/*.ipa,release/*.zip"
          artifactErrorsFailBuild: true
          bodyFile: build/release-notes.md
          allowUpdates: true
