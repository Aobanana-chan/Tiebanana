name: tieba_backend_demo
description: Tiebanana 的默认后端：不联网，返回一套可交互的本地数据，供公开仓库开箱即用 / 测试。
version: 0.1.0
# TODO(opensource): 建远程仓库后决定是否发布；当前作为应用仓库内的 path 包。
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # 与目标 Tiebanana 版本要求的契约范围一致（见 docs/contract-versioning.md）。
  tieba_contract:
    path: ../tieba_contract
    version: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
