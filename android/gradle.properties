org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation cache breaks when plugin sources live on a
# different drive than the project (pub cache on C:, project on D:).
kotlin.incremental=false
# Old discontinued pub plugins declare old compileSdk values; the AAR metadata
# check would fail on androidx transitive requirements. Forced via compileSdk
# injection in android/build.gradle; keep the check off as a safety net.
android.disable.aar.metadata.check=true
# AGP 9 rejects getDefaultProguardFile('proguard-android.txt') (it contains
# -dontoptimize). flutter_inappwebview_android 1.1.3 (the Android impl of
# flutter_inappwebview 6.1.x, still the newest stable line) still references it,
# so project evaluation fails before any code is compiled. This flag is AGP's
# official opt-out (default flipped to true in 9.0). Remove once
# flutter_inappwebview 6.2 stable ships.
android.r8.proguardAndroidTxt.disallowed=false
