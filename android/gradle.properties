org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation cache breaks when plugin sources live on a
# different drive than the project (pub cache on C:, project on D:).
kotlin.incremental=false
# Old discontinued pub plugins declare old compileSdk values; the AAR metadata
# check would fail on androidx transitive requirements. Forced via compileSdk
# injection in android/build.gradle; keep the check off as a safety net.
android.disable.aar.metadata.check=true
